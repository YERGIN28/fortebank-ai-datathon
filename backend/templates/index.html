<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForteBank Video Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        img {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<h1>ForteBank Video Analysis</h1>

<p>Upload a .mov video for analysis</p>

<input type="file" id="videoFile" accept=".mov">

<button onclick="uploadVideo()">
    Analyze
</button>

<div id="status"></div>

<div id="result" class="card hidden">

    <h2>Analysis Result</h2>

    <p>
        <strong>Verdict:</strong>
        <span id="verdict"></span>
    </p>

    <div id="violations"></div>

</div>


<script>




async function uploadVideo() {

    const fileInput = document.getElementById("videoFile");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    if (!fileInput.files.length) {
        status.innerText = "Please select a .mov file";
        return;
    }

    const file = fileInput.files[0];

    const formData = new FormData();
    formData.append("file", file);

    status.innerText = "Uploading...";
    result.classList.add("hidden");

    try {

        const response = await fetch("/ui/analyze", {
    method: "POST",
    body: formData
        });

        if (!response.ok) {
            const error = await response.json();
            status.innerText = "Error: " + error.detail;
            return;
        }

        const data = await response.json();

        status.innerText = "Processing...";

        checkJob(data.job_id);

    } catch (error) {

        status.innerText = "Request failed";

    }

}


async function checkJob(jobId) {

    const status = document.getElementById("status");

    try {

        const response = await fetch(
            `/ui/jobs/${jobId}`
        );

        const data = await response.json();

        if (data.status === "processing") {

            status.innerText = "Processing...";

            setTimeout(
                () => checkJob(jobId),
                1000
            );

            return;
        }

        if (data.status === "failed") {

            status.innerText =
                "Analysis failed: " + data.error;

            return;
        }

        if (data.status === "done") {

            status.innerText = "Analysis complete";

            showResult(data);

        }

    } catch (error) {

        status.innerText = "Failed to check job status";

    }

}


function showResult(data) {

    const result = document.getElementById("result");
    const verdict = document.getElementById("verdict");
    const violationsContainer =
        document.getElementById("violations");

    result.classList.remove("hidden");

    verdict.innerText = data.verdict;

    violationsContainer.innerHTML = "";

    if (!data.violations || data.violations.length === 0) {

        violationsContainer.innerHTML =
            "<p>No violations detected</p>";

        return;
    }

    data.violations.forEach((violation, index) => {

        const violationDiv =
            document.createElement("div");

        violationDiv.className = "card";

        let html = `
            <h3>Violation ${index + 1}</h3>

            <p>
                <strong>Type:</strong>
                ${violation.type}
            </p>

            <p>
                <strong>Time:</strong>
                ${violation.timecode_sec} sec
            </p>

            <p>
                <strong>Description:</strong>
                ${violation.description}
            </p>
        `;

        if (
            violation.evidence_frames &&
            violation.evidence_frames.length > 0
        ) {

            violation.evidence_frames.forEach(frame => {

                html += `
                    <p>
                        Evidence frame:
                        ${frame.timestamp_sec} sec
                    </p>

                    <img
                        src="data:image/jpeg;base64,${frame.image_base64}"
                    >
                `;

            });

        }

        violationDiv.innerHTML = html;

        violationsContainer.appendChild(
            violationDiv
        );

    });

}

</script>

</body>
</html>
